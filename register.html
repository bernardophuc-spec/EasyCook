<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register</title>
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="asset/icon.jpg">
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="logo">
          <img src="asset/icon.jpg" alt="Logo" />
        </div>

        <h1>Tạo tài khoản</h1>

        <p class="subtitle">Đăng ký tài khoản</p>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Tên</label>

            <input
              type="text"
              id="name"
              placeholder="Nhập tên của bạn"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>

            <input
              type="email"
              id="email"
              placeholder="Nhập email của bạn"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>

            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu của bạn."
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm-password">Xác nhận mật khẩu</label>

            <input
              type="password"
              id="confirm-password"
              placeholder="Xác nhận mật khẩu"
              required
            />
          </div>

          <button type="submit" class="auth-button">Tạo tài khoản</button>
        </form>

        <p class="switch-page">
          Bạn đã có tài khoản rồi?
          <a href="login.html">Đăng nhập</a>
        </p>
      </div>
    </div>
    <script>
        (function () {
          if (
            !window.chatbase ||
            window.chatbase("getState") !== "initialized"
          ) {
            window.chatbase = (...argument) => {
              if (!window.chatbase.q) {
                window.chatbase.q = [];
              }
              window.chatbase.q.push(arguments);
            };
            window.chatbase = new Proxy(window.chatbase, {
              get(target, prop) {
                if (prop === "q") {
                  return target.q;
                }
                return (...args) => target(prop, ...args);
              },
            });
          }
          const onLoad = function () {
            const script = document.createElement("script");
            script.src = "https://www.chatbase.co/embed.min.js";
            script.id = "5R6VJYraHkcKjs_cteOMJ";
            script.domain = "www.chatbase.co";
            document.body.appendChild(script);
          };
          if (document.readyState === "complete") {
            onLoad();
          } else {
            window.addEventListener("load", onLoad);
          }
        })();
      </script>
    <script src="js/register.js"></script>
  </body>
</html>
